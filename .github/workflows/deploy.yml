name: test-migrate-deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip D1 migrations (use only when they were applied out of band)"
        type: boolean
        default: false

concurrency:
  group: stl-grow-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Bundle check (no credentials needed)
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Did migrations change?
        id: mig
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "${{ github.sha }}" -- migrations; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set (see README, step 3)."
            exit 1
          fi
          # Does the account-ID secret match an account this token can reach?
          # (A mismatch surfaces later as a misleading "no permission" 7500.)
          # GitHub masks secret values in logs, so a match shows as *** below.
          npx wrangler whoami 2>&1 | tee whoami.txt | grep -vE '^\s*$' | tail -15
          if ! grep -qF -- "$CLOUDFLARE_ACCOUNT_ID" whoami.txt; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not match any account this token can access. Re-set the secret (no spaces or quotes) from Workers & Pages > Overview > Account ID."
            exit 1
          fi
          echo "Account ID secret matches a token account."

      - name: Apply D1 migrations
        if: ${{ steps.mig.outputs.changed == 'true' && !inputs.skip_migrations }}
        run: npx wrangler d1 migrations apply grow-db --remote

      - name: Deploy
        run: npx wrangler deploy

      - name: Smoke test
        # /grow/health must reach this Worker (200, or 302 once Access covers it);
        # a 404 means the dashboard routes are missing. /grow/ must never be 200
        # without auth. A browser-like UA avoids the zone's bot protection.
        run: |
          UA="Mozilla/5.0 (stl-grow CI smoke test; +https://stluker.com)"
          sleep 10
          h=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -H 'Cache-Control: no-cache' https://stluker.com/grow/health)
          a=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -H 'Cache-Control: no-cache' https://stluker.com/grow/)
          echo "health=$h app(unauthenticated)=$a"
          if [ "$a" = "200" ]; then echo "::error::/grow/ answered 200 without auth"; exit 1; fi
          if [ "$h" != "200" ] && [ "$h" != "302" ]; then
            echo "::error::/grow/health returned $h: the stluker.com/grow routes are probably missing (see wrangler.jsonc)"
            exit 1
          fi
